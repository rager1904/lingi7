name: Lingi7 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  DJANGO_SETTINGS_MODULE: config.settings.test
  SECRET_KEY: "ci-test-secret-key-not-used-in-production-never-commit-real-key"
  DATABASE_URL: "postgres://lingi7:lingi7_ci@localhost:5432/lingi7_test"
  REDIS_URL: "redis://localhost:6379/0"
  CELERY_BROKER_URL: "redis://localhost:6379/1"
  CELERY_RESULT_BACKEND: "redis://localhost:6379/2"
  INTERNAL_API_KEY: "ci-internal-key"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"

jobs:
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: lingi7_test
          POSTGRES_USER: lingi7
          POSTGRES_PASSWORD: lingi7_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run database migrations
        run: python manage.py migrate --run-syncdb

      - name: Run linting (flake8)
        run: |
          flake8 apps/ config/ \
            --max-line-length=100 \
            --extend-ignore=E203,W503 \
            --exclude=migrations

      - name: Run security scan (bandit)
        run: bandit -r apps/ -c pyproject.toml -ll

      - name: Run isort check
        run: isort --check-only --profile black apps/ config/

      - name: Run black check
        run: black --check apps/ config/

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=apps \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v \
            --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── Docker build check ──────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (builder stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          target: builder
          tags: lingi7:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
