events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    client_max_body_size 20m;
    server_tokens off;

    # ── Upstreams ──────────────────────────────────────────────────

    upstream lingi7_django {
        server lingi7-web:8000;
    }

    upstream assistant_backend {
        server chain-server:8009;
    }

    upstream assistant_frontend {
        server shopping-frontend:3000;
    }

    # ── Unified Server ─────────────────────────────────────────────
    server {
        listen 80;

        # ── Static & media from shared volumes (OCI deploy) ────────
        # lingi7-web writes/collects these; nginx serves them directly.
        location /media/ {
            alias /srv/media/;
            expires 7d;
            access_log off;
        }

        # ── Django static (admin CSS/JS via Whitenoise) ──────────────
        location /static/ {
            proxy_pass http://lingi7_django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
            access_log off;
        }

        # ── Lingi7 Django ─────────────────────────────────────────
        location /admin/ {
            proxy_pass http://lingi7_django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health/ {
            proxy_pass http://lingi7_django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/ {
            proxy_pass http://lingi7_django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Catalog Enrichment ─────────────────────────────────────
        # The enrichment service is internal only. Browser clients must go
        # through the authenticated Django gateway at
        # /api/v1/products/enrichment-workbench/. Direct proxy removed.
        location /api/enrichment/ {
            return 404;
        }

        location /enrichment/ {
            return 404;
        }

        # ── Shopping Assistant ─────────────────────────────────────
        location /api/assistant/ {
            proxy_pass http://assistant_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /assistant/ {
            proxy_pass http://assistant_frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Static assets for assistant ────────────────────────────
        location /shared/images/ {
            proxy_pass http://assistant_frontend/;
            proxy_set_header Host $host;
        }

        # ── Default: landing page ──────────────────────────────────
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Fallback: show API index
            error_page 404 /api-index.html;
            location = /api-index.html {
                return 200 '{ "service": "Lingi7 Platform", "endpoints": { "core": "/api/v1/", "assistant": "/api/assistant/", "health": "/health/" } }';
                add_header Content-Type application/json;
            }
        }
    }
}